[project]
name = "balrog-prey-analyzer"
description = "A Cat Prey Analyzer software, based on tensorflow, and OpenCV."
keywords = ["cat", "prey", "opencv", "tensorflow", "telegram", "surepet"]
version = "0.3"
readme = "README.md"
license = { file= "LICENSE" }
requires-python = ">= 3.11, <3.12"
dependencies = [
    "cython",
    "kagglehub",
    "lxml",
    "matplotlib<=3.9.1",
    "opencv-contrib-python-headless==4.10.0.84",
    "pillow",
    "python-telegram-bot[job-queue]<=21.4",
    "pytype>=2023.12.18",
    "surepy>=0.9.0",
    "tensorflow<=2.15.1"
]
authors = [
    { name = "niciBume", email = "unknown@example.com" },
    { name = "Diego Rivera", email = "dieriverav@gmail.com" }
]
maintainers = [
    { name = "Diego Rivera", email = "dieriverav@gmail.com" }
]

[project.optional-dependencies]
with-cuda = [
    "tensorflow[and-cuda]<=2.15.1",
    "tensorrt"
]

[tool.setuptools]
py-modules = ["balrog"]

[tool.pytype]
inputs = ['balrog']
